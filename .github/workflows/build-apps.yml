name: Build VidLoom Apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'static/logo.png'
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/build-apps.yml'

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name VidLoom --add-data "../static/logo.png;static" app.py
      - name: Verify Windows build
        run: |
          if (!(Test-Path dist\VidLoom.exe)) { throw 'VidLoom.exe was not created' }
          Get-Item dist\VidLoom.exe
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Windows
          path: desktop/dist/VidLoom.exe
          if-no-files-found: error

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android
    env:
      JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install Linux and Android build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip curl openjdk-17-jdk python3-pip python3-venv build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'buildozer>=1.5.0' 'Cython==0.29.36'
      - name: Install Android command line tools, SDK platform and Build Tools
        shell: bash
        run: |
          set -euxo pipefail
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          rm -rf "$SDK/cmdline-tools/latest" /tmp/android-cmdline
          mkdir -p /tmp/android-cmdline
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o /tmp/cmdline-tools.zip
          unzip -q /tmp/cmdline-tools.zip -d /tmp/android-cmdline
          mkdir -p "$SDK/cmdline-tools/latest"
          cp -a /tmp/android-cmdline/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          export PATH="$JAVA_HOME/bin:$SDK/platform-tools:$SDK/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
          sdkmanager --sdk_root="$SDK" --update
          sdkmanager --sdk_root="$SDK" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || true
          test -x "$SDK/build-tools/35.0.0/aidl"
          "$SDK/build-tools/35.0.0/aidl" --version
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/build-tools/35.0.0" >> "$GITHUB_PATH"
      - name: Build APK with Buildozer
        shell: bash
        run: |
          set -euxo pipefail
          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/build-tools/35.0.0:$PATH"
          buildozer android clean || true
          buildozer -v android debug
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit)"
      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Android
          path: android/bin/*.apk
          if-no-files-found: error

  release:
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v5
        with:
          name: VidLoom-Windows
          path: release
      - name: Download Android artifact
        uses: actions/download-artifact@v5
        with:
          name: VidLoom-Android
          path: release
      - name: Rename release files
        run: |
          mv release/VidLoom.exe release/VidLoom-Windows.exe
          APK=$(find release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          mv "$APK" release/VidLoom-Android.apk
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: VidLoom v1.1.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/VidLoom-Windows.exe
            release/VidLoom-Android.apk
