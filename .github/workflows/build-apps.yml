name: Build VidLoom Apps

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'android/**'
      - '.github/workflows/build-apps.yml'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name VidLoom app.py
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Windows
          path: desktop/dist/VidLoom.exe

  android:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Android build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev
          python -m pip install --upgrade pip
          python -m pip install --upgrade buildozer cython
      - name: Build APK with Buildozer
        run: buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VidLoom-Android
          path: android/bin/*.apk
